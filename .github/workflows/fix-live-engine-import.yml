name: Fix live engine import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[fix-live-engine]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point runtime wrapper at v2
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text(encoding='utf-8')
          old = 'from decision_engine import current_gameweek, load_manager as _load_manager, decision_summary'
          new = 'from decision_engine_v2 import current_gameweek, load_manager as _load_manager, decision_summary'
          if old not in s:
              raise SystemExit('Expected runtime wrapper import not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile streamlit_app.py decision_engine_v2.py
      - name: Commit fix
        run: |
          git config user.name 'fpl-analyzer-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m '[fix-live-engine] Point runtime wrapper at v2'
          git push
