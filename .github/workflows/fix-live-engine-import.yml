name: Validate live engine import

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify runtime wrapper points at v2
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('streamlit_app.py').read_text(encoding='utf-8')
          if 'from decision_engine_v2 import current_gameweek, load_manager as _load_manager, decision_summary' not in s:
              raise SystemExit('Runtime wrapper is not using decision_engine_v2')
          print('Runtime wrapper OK')
          PY
      - name: Validate Python syntax
        run: python -m py_compile streamlit_app.py streamlit_app_v2.py decision_engine_v2.py manager_sync.py sitecustomize.py
