name: Validate FPL model wiring

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate model and app wiring
        run: python -m py_compile streamlit_app.py streamlit_app_v2.py fpl_model_v2.py fast_squad_optimizer.py decision_engine.py decision_engine_v2.py manager_sync.py sitecustomize.py
