name: Fix pitch design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Streamlit pitch styling
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('streamlit_app.py')
          s = p.read_text(encoding='utf-8')

          old = 'div[data-testid="stVerticalBlock"]:has(.pitch-anchor)'
          new = '.st-key-best-pitch, .st-key-built-pitch, .st-key-build-pitch'
          s = s.replace(old, new)

          old = 'div[data-testid="stVerticalBlock"]:has(.pitch-anchor) button'
          new = '.st-key-best-pitch button, .st-key-built-pitch button, .st-key-build-pitch button'
          s = s.replace(old, new)

          s = s.replace(
              'f"https://resources.premierleague.com/premierleague/photos/players/110x140/p{photo}.png"',
              'f"https://resources.premierleague.com/premierleague25/photos/players/110x140/{photo}.png"'
          )
          s = s.replace(
              'f"https://resources.premierleague.com/premierleague/photos/players/250x250/p{photo}.png"',
              'f"https://resources.premierleague.com/premierleague25/photos/players/500x500/{photo}.png"'
          )

          marker = '    .pitch-title { text-align:center;'
          css = '''    .image-wrap { display:inline-flex; align-items:center; justify-content:center; overflow:hidden; border-radius:50%; }
          .image-wrap img { width:100%; height:100%; object-fit:cover; }
          .image-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#20242d; color:rgba(255,255,255,.85); font-weight:800; font-size:.9rem; border:3px solid rgba(255,255,255,.9); }
          .pitch-title { text-align:center;'''
          s = s.replace(marker, css, 1)

          s = s.replace(
              'def render_static_pitch(xi, formation, locked_ids=None, title="LAGOPPSTILLING"):',
              'def render_static_pitch(xi, formation, locked_ids=None, title="LAGOPPSTILLING", key="fpl_static_pitch"): '
          )
          s = s.replace(
              '    with st.container():\n        st.markdown(\'<span class="pitch-anchor"></span>\', unsafe_allow_html=True)',
              '    with st.container(key=key):\n        st.markdown(\'<span class="pitch-anchor"></span>\', unsafe_allow_html=True)'
          )

          s = s.replace(
              'render_static_pitch(xi, infer_formation(xi), title="STARTING XI")',
              'render_static_pitch(xi, infer_formation(xi), title="STARTING XI", key="best-pitch")'
          )
          s = s.replace(
              'render_static_pitch(display_xi, formation, selected_ids, title=f"{formation} · DITT LAG")',
              'render_static_pitch(display_xi, formation, selected_ids, title=f"{formation} · DITT LAG", key="built-pitch")'
          )

          # Scope the interactive build-around pitch to its own keyed container.
          needle = '    with st.container():\n        st.markdown(\'<span class="pitch-anchor"></span>\', unsafe_allow_html=True)\n        st.markdown(f\'<div class="pitch-title">{formation} · TOM BANE</div>\', unsafe_allow_html=True)'
          replacement = '    with st.container(key="build-pitch"):\n        st.markdown(\'<span class="pitch-anchor"></span>\', unsafe_allow_html=True)\n        st.markdown(f\'<div class="pitch-title">{formation} · TOM BANE</div>\', unsafe_allow_html=True)'
          s = s.replace(needle, replacement)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix pitch container styling and player photos"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix_pitch_design.yml
          git add .github/workflows/fix_pitch_design.yml
          git commit -m "Remove temporary pitch fix workflow"
          git push
