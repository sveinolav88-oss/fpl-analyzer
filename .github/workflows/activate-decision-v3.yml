name: Activate Decision Engine v3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  activate:
    if: ${{ !contains(github.event.head_commit.message, 'Activate Decision Engine v3') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate v3 engine
        run: |
          cat > decision_engine_v2.py <<'PY'
          """Compatibility layer for the maintained FPL Decision Engine."""
          from decision_engine_v3 import *
          PY
          rm -f .github/workflows/activate-decision-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add decision_engine_v2.py .github/workflows/activate-decision-v3.yml
          git commit -m 'Activate Decision Engine v3'
          git push
